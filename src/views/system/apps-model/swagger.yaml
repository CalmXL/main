      tags:
      - 模型管理
  /api/v1/models/template:
    get:
      consumes:
      - application/json
      description: 下载模型批量导入的Excel模板文件
      produces:
      - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
      responses:
        "200":
          description: 模板文件
          schema:
            type: file
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/model.Response'
      summary: 获取导入模板
      tags:
      - 模型管理
  /health:
    get:
      consumes:
      - application/json
      description: 检查服务基本健康状态
      produces:
      - application/json
      responses:
        "200":
          description: 服务正常
          schema:
            allOf:
            - $ref: '#/definitions/model.Response'
            - properties:
                data:
                  $ref: '#/definitions/model.HealthResponse'
              type: object
        "503":
          description: 服务不可用
          schema:
            $ref: '#/definitions/model.Response'
      summary: 健康检查
      tags:
      - 系统监控
  /status:
    get:
      consumes:
      - application/json
      description: 获取系统详细状态信息，包括数据库、模型统计等
      produces:
      - application/json
      responses:
        "200":
          description: 获取成功
          schema:
            allOf:
            - $ref: '#/definitions/model.Response'
            - properties:
                data:
                  $ref: '#/definitions/model.StatusResponse'
              type: object
      summary: 系统状态检查
      tags:
      - 系统监控
  /v1/chat/completions:
    post:
      consumes:
      - application/json
      description: 提供OpenAI兼容的聊天完成API，支持多厂商模型
      parameters:
      - description: 聊天请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/model.ChatCompletionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 聊天响应
          schema:
            $ref: '#/definitions/model.ChatCompletionResponse'
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "401":
          description: 认证失败
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: OpenAI兼容聊天接口
      tags:
      - OpenAI兼容接口
  /v1/models:
    get:
      consumes:
      - application/json
      description: 获取当前应用可使用的模型列表
      produces:
      - application/json
      responses:
        "200":
          description: 模型列表
          schema:
            $ref: '#/definitions/model.ModelsResponse'
        "401":
          description: 认证失败
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: 获取可用模型列表
      tags:
      - OpenAI兼容接口
securityDefinitions:
  ApiKeyAuth:
    description: 输入Bearer {token}格式的API密钥
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
