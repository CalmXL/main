<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <meta name="renderer" content="webkit" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <link rel="icon" href="/logo.svg" />
    <title>%VITE_APP_TITLE%</title>
    <style>
      html,
      body,
      #app {
        height: 100%;
        margin: 0px;
        padding: 0px;
      }

      .chromeframe {
        margin: 0.2em 0;
        background: #ccc;
        color: #000;
        padding: 0.2em 0;
      }

      #loader-wrapper {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        z-index: 999999;
        align-items: center;
        flex-direction: column;
        justify-content: center;

      }
      #loader {
        width: 200px;
        height: auto;
        margin-bottom: 10px;
      }

      .load_title {
        color: #333;
        font-size: 16px;
        font-weight: bold;
        margin-top: 10px;
      }

    </style>
    <!-- inject:css -->
    <!-- inject:script -->
  </head>

  <body>
    <div id="app">
      <div id="loader-wrapper">
        <img id="loader" src="/logo_loading.svg" alt="loading" />
        <span class="load_title">正在加载系统资源，请耐心等待</span>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
